<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DataBits - AI Solutions</title>
    <link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/u/167419822?s=200&v=4" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@20..48,500,0"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#135bec",
              "background-light": "#f6f6f8",
              "background-dark": "#101622",
            },
            fontFamily: {
              display: ["Space Grotesk", "sans-serif"],
              body: ["Inter", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 24;
      }
      .reveal {
        opacity: 0;
        transform: translateY(24px);
        transition: opacity 0.7s ease, transform 0.7s ease;
        will-change: opacity, transform;
      }
      .reveal.in-view {
        opacity: 1;
        transform: translateY(0);
      }
      .reveal-stagger {
        opacity: 0;
        transform: translateY(32px) scale(0.95);
        transition: opacity 0.6s ease, transform 0.6s ease;
      }
      .reveal-stagger.in-view {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      .reveal-stagger:nth-child(1) { transition-delay: 0.1s; }
      .reveal-stagger:nth-child(2) { transition-delay: 0.2s; }
      .reveal-stagger:nth-child(3) { transition-delay: 0.3s; }
      .reveal-stagger:nth-child(4) { transition-delay: 0.4s; }
      .reveal-stagger:nth-child(5) { transition-delay: 0.5s; }
      .reveal-stagger:nth-child(6) { transition-delay: 0.6s; }
      .typing-caret {
        display: inline-block;
        width: 0.6ch;
        animation: blink 1s steps(1, end) infinite;
      }
      @keyframes blink {
        50% { opacity: 0; }
      }
      body {
        font-family: 'Space Grotesk', sans-serif;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
</head>
  <body class="bg-background-light dark:bg-background-dark text-gray-900 dark:text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
